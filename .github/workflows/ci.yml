name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.work/cargo
  RUSTUP_HOME: ${{ github.workspace }}/.work/rustup
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  GRADLE_USER_HOME: ${{ github.workspace }}/.work/gradle
  ANDROID_USER_HOME: ${{ github.workspace }}/.work/android
  RUNNER_TOOL_CACHE: ${{ github.workspace }}/.work/tools
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  ticketboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          python3 -B tests/ticketboard/validate.py
          python3 -B -m unittest discover -s tests/ticketboard -v
          git diff --check

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain in workspace
        run: |
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" .work/tmp
          echo "TMPDIR=$PWD/.work/tmp" >> "$GITHUB_ENV"
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustc -Vv
          cargo -V
      - name: Core gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo test --workspace --all-features --locked --release
          cargo build --workspace --all-features --locked --release
          git diff --exit-code -- Cargo.lock
      - name: Dependency advisory, license, version and source gates
        run: |
          curl --fail --location --retry 3 \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            --output .work/cargo-deny.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  .work/cargo-deny.tar.gz' | sha256sum --check
          tar -xzf .work/cargo-deny.tar.gz -C .work
          .work/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny --version
          .work/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny --all-features --locked --config src/core/deny.toml check

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17.0.15+6
          settings-path: ${{ github.workspace }}/.work/maven
      - name: Build Rust library and Kotlin bindings
        run: |
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" .work/tmp
          export TMPDIR="$PWD/.work/tmp"
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          cat "$ANDROID_HOME/ndk/27.3.13750724/source.properties"
          python3 -B src/core/build_bindings.py android
      - name: Verify wrapper
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  src/android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Android build and lint
        working-directory: src/android
        run: |
          mkdir -p "$ANDROID_USER_HOME" ../../.work/tmp ../../.work/java-home
          export TMPDIR="$GITHUB_WORKSPACE/.work/tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$TMPDIR -Duser.home=$GITHUB_WORKSPACE/.work/java-home"
          java -version
          cat "$ANDROID_HOME/platforms/android-36/source.properties"
          cat "$ANDROID_HOME/build-tools/35.0.0/source.properties"
          bash gradlew --version
          bash gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest
      - name: Verify packaged native libraries
        run: |
          python3 -B tests/integration/ffi/check_android_apk.py \
            src/android/app/build/outputs/apk/debug/app-debug.apk \
            src/android/app/build/outputs/apk/release/app-release-unsigned.apk
          for apk in src/android/app/build/outputs/apk/*/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          done

      - name: BLE probe Android build and lint
        run: |
          mkdir -p "$ANDROID_USER_HOME" .work/tmp .work/java-home
          export TMPDIR="$PWD/.work/tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$TMPDIR -Duser.home=$PWD/.work/java-home"
          bash src/android/gradlew -p src/android/ble --no-daemon assembleDebug assembleRelease lintDebug

      - name: Security probe Android build and lint
        run: |
          mkdir -p "$ANDROID_USER_HOME" .work/tmp .work/java-home
          export TMPDIR="$PWD/.work/tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$TMPDIR -Duser.home=$PWD/.work/java-home"
          python3 -B src/core/build_bindings.py android --security-probe
          python3 -B src/android/security/build_sqlcipher.py
          bash src/android/gradlew -p src/android/security --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest lintDebug
          python3 -B tests/bench/security/check_android_apk.py \
            src/android/security/build/outputs/apk/debug/*.apk \
            src/android/security/build/outputs/apk/release/*.apk
          for apk in src/android/security/build/outputs/apk/debug/*.apk src/android/security/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          done
      - name: Security probe emulator lifecycle
        run: |
          mkdir -p .work/emulator-sdk/cmdline-tools/latest .work/android/avd .work/tmp
          export TMPDIR="$PWD/.work/tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$TMPDIR -Duser.home=$PWD/.work/java-home"
          cp -RL "$ANDROID_HOME/cmdline-tools/latest/." .work/emulator-sdk/cmdline-tools/latest/
          sdk_tools="$PWD/.work/emulator-sdk/cmdline-tools/latest/bin"
          cp -R "$ANDROID_HOME/licenses" .work/emulator-sdk/licenses
          "$sdk_tools/sdkmanager" --sdk_root="$PWD/.work/emulator-sdk" \
            'platform-tools' 'emulator' 'system-images;android-29;default;x86_64'
          export ANDROID_HOME="$PWD/.work/emulator-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$PWD/.work/android/avd"
          cat "$ANDROID_HOME/system-images/android-29/default/x86_64/source.properties"
          echo no | "$sdk_tools/avdmanager" create avd --name mc005 \
            --package 'system-images;android-29;default;x86_64' --path "$PWD/.work/android/mc005.avd"
          acceleration=off
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then acceleration=on; fi
          "$ANDROID_HOME/emulator/emulator" -avd mc005 -port 5554 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel "$acceleration" > .work/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 600 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 wait-for-device
          for attempt in $(seq 1 300); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              break
            fi
            sleep 2
          done
          if [ "$("$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; then
            tail -n 80 .work/emulator.log
            exit 1
          fi
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell input keyevent 82
          python3 -B tests/bench/security/run_android_emulator.py --serial emulator-5554

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record SDK and compiler versions
        run: |
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks
          plutil -lint src/ios/MeshChat.xcodeproj/project.pbxproj
      - name: Build Rust libraries and Swift bindings
        run: |
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" .work/tmp .work/clang-module-cache
          export TMPDIR="$PWD/.work/tmp"
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          python3 -B src/core/build_bindings.py ios
      - name: Swift host FFI regression
        run: |
          xcrun swiftc -swift-version 6 -warnings-as-errors \
            -module-cache-path "$PWD/.work/clang-module-cache" \
            -I .work/ffi/swift -Xcc -fmodule-map-file=.work/ffi/swift/meshchat_coreFFI.modulemap \
            .work/ffi/swift/meshchat_core.swift tests/integration/ffi/main.swift \
            -L target/debug -lmeshchat_core -Xlinker -rpath -Xlinker "$PWD/target/debug" \
            -o .work/ffi/swift-regression
          .work/ffi/swift-regression
      - name: Build unsigned iOS skeleton
        run: |
          mkdir -p .work/tmp .work/clang-module-cache
          export TMPDIR="$PWD/.work/tmp"
          for configuration in Debug Release; do
            xcodebuild -project src/ios/MeshChat.xcodeproj -scheme MeshChat \
              -configuration "$configuration" -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$PWD/.work/ios-derived-data" \
              -clonedSourcePackagesDirPath "$PWD/.work/swift-packages" \
              CLANG_MODULE_CACHE_PATH="$PWD/.work/clang-module-cache" \
              CODE_SIGNING_ALLOWED=NO build
          done
      - name: Build unsigned iOS BLE probe
        run: |
          mkdir -p .work/tmp .work/ble-module-cache
          export TMPDIR="$PWD/.work/tmp"
          plutil -lint src/ios/BLE/BLEProbe.xcodeproj/project.pbxproj src/ios/BLE/BLEProbe/Info.plist
          for platform in iphonesimulator iphoneos; do
            for configuration in Debug Release; do
              xcodebuild -project src/ios/BLE/BLEProbe.xcodeproj -scheme BLEProbe \
                -configuration "$configuration" -sdk "$platform" \
                -derivedDataPath "$PWD/.work/ble-ios-derived-data/$platform" \
                -clonedSourcePackagesDirPath "$PWD/.work/ble-swift-packages" \
                CLANG_MODULE_CACHE_PATH="$PWD/.work/ble-module-cache" \
                CODE_SIGNING_ALLOWED=NO build
            done
          done
      - name: Build unsigned iOS security probe
        run: |
          mkdir -p .work/tmp .work/security-module-cache
          export TMPDIR="$PWD/.work/tmp"
          python3 -B src/core/build_bindings.py ios --security-probe
          for platform in iphonesimulator iphoneos; do
            for configuration in Debug Release; do
              xcodebuild -project src/ios/Security/SecurityProbe.xcodeproj -scheme SecurityProbe \
                -configuration "$configuration" -sdk "$platform" \
                -derivedDataPath "$PWD/.work/security-ios-derived-data/$platform" \
                -clonedSourcePackagesDirPath "$PWD/.work/security-swift-packages" \
                CLANG_MODULE_CACHE_PATH="$PWD/.work/security-module-cache" \
                CODE_SIGNING_ALLOWED=NO build
            done
          done
      - name: Security curves Swift host interoperability
        run: |
          xcrun swiftc -swift-version 6 -warnings-as-errors \
            -module-cache-path "$PWD/.work/security-module-cache" \
            -I .work/security-ffi/swift -Xcc -fmodule-map-file=.work/security-ffi/swift/meshchat_coreFFI.modulemap \
            .work/security-ffi/swift/meshchat_core.swift tests/bench/security/main.swift \
            -L .work/security-target/debug -lmeshchat_core \
            -Xlinker -rpath -Xlinker "$PWD/.work/security-target/debug" \
            -o .work/security-ffi/swift-regression
          .work/security-ffi/swift-regression
