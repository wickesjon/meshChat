name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.work/cargo
  RUSTUP_HOME: ${{ github.workspace }}/.work/rustup
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  GRADLE_USER_HOME: ${{ github.workspace }}/.work/gradle
  ANDROID_USER_HOME: ${{ github.workspace }}/.work/android
  RUNNER_TOOL_CACHE: ${{ github.workspace }}/.work/tools
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  ticketboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          python3 -B tests/ticketboard/validate.py
          python3 -B -m unittest discover -s tests/ticketboard -v
          git diff --check

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain in workspace
        run: |
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" .work/tmp
          echo "TMPDIR=$PWD/.work/tmp" >> "$GITHUB_ENV"
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustc -Vv
          cargo -V
      - name: Core gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo test --workspace --all-features --locked --release
          cargo build --workspace --all-features --locked --release
          git diff --exit-code -- Cargo.lock
      - name: Dependency advisory, license, version and source gates
        run: |
          curl --fail --location --retry 3 \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            --output .work/cargo-deny.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  .work/cargo-deny.tar.gz' | sha256sum --check
          tar -xzf .work/cargo-deny.tar.gz -C .work
          .work/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny --version
          .work/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny --locked --config src/core/deny.toml check

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17.0.15+6
          settings-path: ${{ github.workspace }}/.work/maven
      - name: Verify wrapper
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  src/android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Android build and lint
        working-directory: src/android
        run: |
          mkdir -p "$ANDROID_USER_HOME" ../../.work/tmp ../../.work/java-home
          export TMPDIR="$GITHUB_WORKSPACE/.work/tmp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$TMPDIR -Duser.home=$GITHUB_WORKSPACE/.work/java-home"
          java -version
          cat "$ANDROID_HOME/platforms/android-35/source.properties"
          cat "$ANDROID_HOME/build-tools/35.0.0/source.properties"
          bash gradlew --version
          bash gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug

  ios:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record SDK and compiler versions
        run: |
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks
          plutil -lint src/ios/MeshChat.xcodeproj/project.pbxproj
      - name: Build unsigned iOS skeleton
        run: |
          mkdir -p .work/tmp .work/clang-module-cache
          export TMPDIR="$PWD/.work/tmp"
          for configuration in Debug Release; do
            xcodebuild -project src/ios/MeshChat.xcodeproj -scheme MeshChat \
              -configuration "$configuration" -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$PWD/.work/ios-derived-data" \
              -clonedSourcePackagesDirPath "$PWD/.work/swift-packages" \
              CLANG_MODULE_CACHE_PATH="$PWD/.work/clang-module-cache" \
              CODE_SIGNING_ALLOWED=NO build
          done
