[package]
name = "meshchat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
uniffi = { version = "=0.29.4", default-features = false }
thiserror = "=2.0.12"

ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"], optional = true }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
getrandom = { version = "=0.4.3", optional = true }
zeroize = { version = "=1.8.1", optional = true }

[features]
security-probe = ["dep:ed25519-dalek", "dep:x25519-dalek", "dep:getrandom", "dep:zeroize"]
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[test]]
name = "foundation"
path = "../../tests/integration/ffi/foundation.rs"

[[test]]
name = "security_probe"
path = "../../tests/bench/security/curves.rs"
required-features = ["security-probe"]

[lints]
workspace = true
