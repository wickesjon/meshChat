[package]
name = "meshchat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
uniffi = { version = "=0.29.4", default-features = false }
thiserror = "=2.0.12"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.24"
unicode-security = "=0.1.2"

ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
getrandom = { version = "=0.4.3" }
zeroize = "=1.8.1"
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
sha2_11 = { package = "sha2", version = "=0.11.0", default-features = false, features = ["zeroize"] }
subtle = { version = "=2.6.1", default-features = false }
# Enable supported key/state clearing in HPKE's existing symmetric dependencies.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
poly1305 = { version = "=0.9.1", default-features = false, features = ["zeroize"] }

[features]
security-probe = []
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[test]]
name = "foundation"
path = "../../tests/integration/ffi/foundation.rs"

[[test]]
name = "codec"
path = "../../tests/integration/codec/codec.rs"

[[test]]
name = "codec_fuzz"
path = "../../tests/fuzz/codec_smoke.rs"

[[test]]
name = "transport"
path = "../../tests/integration/transport/framing.rs"

[[test]]
name = "framing_fuzz"
path = "../../tests/fuzz/framing_smoke.rs"

[[test]]
name = "security_probe"
path = "../../tests/bench/security/curves.rs"
required-features = ["security-probe"]

[[test]]
name = "links"
path = "../../tests/integration/links/links.rs"

[[test]]
name = "links_fuzz"
path = "../../tests/fuzz/links_smoke.rs"

[[test]]
name = "ingress"
path = "../../tests/integration/ingress/ingress.rs"

[[test]]
name = "ingress_fuzz"
path = "../../tests/fuzz/ingress_smoke.rs"

[[test]]
name = "relay"
path = "../../tests/integration/relay/relay.rs"

[[test]]
name = "sync_cache"
path = "../../tests/integration/sync/cache.rs"

[[test]]
name = "sync_session"
path = "../../tests/integration/sync/session.rs"

[lints]
workspace = true
[[test]]
name = "sync_exchange"
path = "../../tests/integration/sync/exchange.rs"

[[test]]
name = "identity"
path = "../../tests/integration/identity/identity.rs"

[[test]]
