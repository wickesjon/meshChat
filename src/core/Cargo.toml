[package]
name = "meshchat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
uniffi = { version = "=0.29.4", default-features = false }
thiserror = "=2.0.12"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.24"
unicode-security = "=0.1.2"

ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"], optional = true }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
getrandom = { version = "=0.4.3", optional = true }
zeroize = "=1.8.1"

[features]
security-probe = ["dep:ed25519-dalek", "dep:x25519-dalek", "dep:getrandom"]
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[test]]
name = "foundation"
path = "../../tests/integration/ffi/foundation.rs"

[[test]]
name = "codec"
path = "../../tests/integration/codec/codec.rs"

[[test]]
name = "codec_fuzz"
path = "../../tests/fuzz/codec_smoke.rs"

[[test]]
name = "transport"
path = "../../tests/integration/transport/framing.rs"

[[test]]
name = "framing_fuzz"
path = "../../tests/fuzz/framing_smoke.rs"

[[test]]
name = "security_probe"
path = "../../tests/bench/security/curves.rs"
required-features = ["security-probe"]

[[test]]
name = "links"
path = "../../tests/integration/links/links.rs"

[[test]]
name = "links_fuzz"
path = "../../tests/fuzz/links_smoke.rs"

[lints]
workspace = true
