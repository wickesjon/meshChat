[workspace]

[package]
name = "meshchat-wire-checks"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
publish = false

[lib]
path = "wire_bridge.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
meshchat-core = { version = "=0.1.0", path = "../../src/core" }
uniffi = { version = "=0.29.4", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
sha2 = "=0.10.9"
zeroize = "=1.8.1"
thiserror = "=2.0.12"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
